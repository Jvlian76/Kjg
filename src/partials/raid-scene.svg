<svg class="raid-scene" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Gezeichnete Nachtszene im Zeltlager: Überfäller schleichen zum Lagerkreuz, ein Gruli auf Nachtwache leuchtet sie mit der Taschenlampe an und sie rennen davon" stroke="#0b1622" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <linearGradient id="raid-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10233a"/>
      <stop offset="1" stop-color="#24476a"/>
    </linearGradient>
    <radialGradient id="raid-glow">
      <stop offset="0" stop-color="#ffc23d" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ff8a1f" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="raid-beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff4b8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff4b8" stop-opacity="0"/>
    </linearGradient>

    <!-- Überfäller: dunkler Hoodie, Augenmaske, läuft nach rechts -->
    <symbol id="raider" viewBox="0 0 44 64" overflow="visible">
      <g class="runner-body">
        <path class="leg leg-b" d="M20 40 16 58" stroke="#0b1622" stroke-width="6"/>
        <path class="arm arm-b" d="M21 25 12 33" stroke="#0b1622" stroke-width="5"/>
        <path d="M13 26q0-9 9-9t9 9v16H13z" fill="#2b3446" stroke="#0b1622" stroke-width="2.5"/>
        <path class="leg leg-a" d="M23 40 28 58" stroke="#0b1622" stroke-width="6"/>
        <circle cx="22" cy="11" r="8.5" fill="#f2c8a0" stroke="#0b1622" stroke-width="2.5"/>
        <path d="M13.5 9.5a8.5 8.5 0 0 1 17 0" fill="#2b3446" stroke="#0b1622" stroke-width="2.5"/>
        <rect x="14" y="9.5" width="17" height="5" rx="2" fill="#0b1622" stroke="none"/>
        <circle cx="20" cy="12" r="1.7" fill="#fff" stroke="none"/><circle cx="26.5" cy="12" r="1.7" fill="#fff" stroke="none"/>
        <path class="arm arm-a" d="M23 25 33 31" stroke="#0b1622" stroke-width="5"/>
      </g>
    </symbol>

    <!-- Überfäller mit geklautem Wimpel -->
    <symbol id="raider-flag" viewBox="0 0 44 64" overflow="visible">
      <use href="#raider" width="44" height="64"/>
      <path d="M34 31 38 2" stroke="#8a5a2b" stroke-width="3"/>
      <path class="flag" d="M38 3 22 0v14l8-5 7 6z" fill="#fff" stroke="#0b1622" stroke-width="2"/>
      <circle cx="30" cy="6" r="2.6" fill="#e2332b" stroke="none"/>
    </symbol>

    <!-- Gruli mit Taschenlampe: grüner KjG-Hoodie -->
    <symbol id="gruli" viewBox="0 0 44 64" overflow="visible">
      <g class="runner-body">
        <path class="leg leg-b" d="M20 40 16 58" stroke="#0b1622" stroke-width="6"/>
        <path d="M13 26q0-9 9-9t9 9v16H13z" fill="#1f8a3a" stroke="#0b1622" stroke-width="2.5"/>
        <path d="M18 28h8v8l-4 3-4-3z" fill="#fff" stroke="none"/>
        <path class="leg leg-a" d="M23 40 28 58" stroke="#0b1622" stroke-width="6"/>
        <circle cx="22" cy="11" r="8.5" fill="#f2c8a0" stroke="#0b1622" stroke-width="2.5"/>
        <path d="M13.5 10q1-9 9-9t8 8q-6-3-17 1z" fill="#7a4a24" stroke="#0b1622" stroke-width="2"/>
        <circle cx="25" cy="12" r="1.5" fill="#0b1622" stroke="none"/>
        <path d="M23 25 35 27" stroke="#0b1622" stroke-width="5"/>
        <rect x="33" y="23.5" width="9" height="6" rx="1.5" fill="#ffc23d" stroke="#0b1622" stroke-width="2"/>
      </g>
    </symbol>
  </defs>

  <!-- Himmel, Sterne, Mond -->
  <rect x="-400" y="-20" width="2000" height="260" fill="url(#raid-sky)" stroke="none"/>
  <g class="twinkle" fill="#fff4b8" stroke="none">
    <circle cx="80" cy="30" r="2"/><circle cx="210" cy="64" r="1.5"/><circle cx="340" cy="22" r="2.2"/><circle cx="470" cy="56" r="1.4"/>
    <circle cx="560" cy="18" r="1.8"/><circle cx="700" cy="44" r="2"/><circle cx="830" cy="20" r="1.5"/><circle cx="930" cy="70" r="1.8"/>
    <circle cx="1150" cy="96" r="1.6"/><circle cx="20" cy="88" r="1.4"/><circle cx="640" cy="84" r="1.3"/><circle cx="1180" cy="28" r="2"/>
  </g>
  <path d="M1068 26a28 28 0 1 0 24 44 23 23 0 0 1-24-44z" fill="#fff4b8" stroke="none"/>

  <!-- Waldrand -->
  <path d="M-200 168V140l20-40 20 40 18-34 18 34 22-48 22 48 16-30 16 30 24-44 24 44 18-36 18 36 20-40 20 40 22-46 22 46 16-32 16 32 24-42 24 42 18-34 18 34 22-48 22 48 20-40 20 40 18-30 18 30 24-46 24 46 18-36 18 36 22-42 22 42 16-30 16 30 24-48 24 48 20-36 20 36 22-44 22 44 18-34 18 34 24-40 24 40 20-46 20 46 18-32 18 32 22-42 22 42 20-38 20 38 24-44 24 44 18-30 18 30 22-46 22 46V168z" fill="#0f2236" stroke="none"/>

  <!-- Boden -->
  <path d="M-200 176c300-14 600-12 900-6s500 6 700 2V240H-200z" fill="#0e3a24"/>

  <!-- Zelte -->
  <path d="M110 176l46-66 46 66z" fill="#9b2f2a"/><path d="M146 176l10-30 10 30z" fill="#0b1622"/>
  <path d="M240 176l36-50 36 50z" fill="#a8842e"/><path d="M268 176l8-22 8 22z" fill="#0b1622"/>
  <path d="M1000 174l44-62 44 62z" fill="#9aa6b4"/><path d="M1034 174l10-28 10 28z" fill="#0b1622"/>

  <!-- Lagerkreuz -->
  <path d="M640 176V58M604 84h72"/>
  <g stroke-width="2.5"><path d="M610 84v22l8-5 8 5V84z" fill="#d8dde3"/><path d="M632 84v22l8-5 8 5V84z" fill="#d8dde3"/><path d="M654 84v22l8-5 8 5V84z" fill="#d8dde3"/></g>
  <circle cx="618" cy="93" r="3" fill="#e2332b" stroke="none"/><circle cx="640" cy="93" r="3" fill="#1f8a3a" stroke="none"/><circle cx="662" cy="93" r="3" fill="#ffc23d" stroke="none"/>
  <path class="flag" d="M641 60l34 8-34 10z" fill="#e2332b"/>

  <!-- Lagerfeuer -->
  <circle cx="820" cy="160" r="90" fill="url(#raid-glow)" stroke="none"/>
  <path d="M798 182l44-10M842 182l-44-10" stroke="#8a5a2b" stroke-width="6"/>
  <path class="flame" d="M820 176c-14 0-17-12-12-21 3 5 5 6 7 5-3-10 4-19 9-24 0 9 12 14 12 26 0 9-7 14-16 14z" fill="#ff8a1f"/>
  <path class="flame flame-2" d="M820 176c-6 0-8-5-5-10 2 2 3 3 4 2-1-5 2-9 4-11 0 4 5 7 5 12 0 4-3 7-8 7z" fill="#ffc23d" stroke-width="2"/>

  <!-- Gruli auf Nachtwache mit Taschenlampe (Lichtkegel nach links) -->
  <polygon class="raid-beam" points="866,146 520,104 520,192" fill="url(#raid-beam)" stroke="none"/>
  <g transform="translate(900 120) scale(-1 1)">
    <use href="#gruli" width="44" height="64" class="still"/>
  </g>

  <!-- Überfäller schleichen sich an -->
  <g class="raiders">
    <text class="raid-alarm" x="96" y="96" fill="#ffc23d" stroke="none" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30">!!</text>
    <use href="#raider" x="0" y="116" width="44" height="64" style="--step:.42s"/>
    <use href="#raider" x="52" y="114" width="44" height="64" style="--step:.38s"/>
    <use href="#raider" x="104" y="117" width="44" height="64" style="--step:.45s"/>
  </g>
</svg>
